# .aider.conf.yml — Configuración de Aider para Backend (FastAPI + Clean Architecture)

# Archivo de directivas y reglas operativas
conventions: .aider.conventions.md

# Comando de linter automático
lint-cmd: ruff check --fix . && ruff format .
auto-lint: true

# Guantelete de Restricciones (AST) y Suite de Pruebas
test-cmd: python3 tests/test_architecture.py && pytest --maxfail=1 -q
auto-test: true

# Control de commits automáticos bajo Conventional Commits
auto-commits: true
attribute-author: false
attribute-committer: false
