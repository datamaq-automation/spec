# .aider.conf.yml — Configuración de Aider para Frontend (Vue 3 + Vite + FSD)

# Archivo de directivas y reglas operativas
conventions: .aider.conventions.md

# Comando de linter automático
lint-cmd: npm run lint
auto-lint: true

# Guantelete de Restricciones Estático y Suite de Pruebas
test-cmd: node scripts/test_architecture.mjs && npm run test:unit
auto-test: true

# Control de commits automáticos bajo Conventional Commits
auto-commits: true
attribute-author: false
attribute-committer: false
